# Baut MPC Messenger 1.4 (JJ DA PLUG) für die MPC (Live 1/2, One, X, Key, Force) und legt die fertige ZIP-Datei als Download bereit.
# Start: Reiter "Actions" -> "Build MPC Messenger" -> "Run workflow". Danach die ZIP unter "Artifacts" herunterladen.
name: Build MPC Messenger
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@28038025aa91f24ff9a52e831df236b435c6ef87
    permissions:
      contents: write
    with:
      tag: mpc-messenger-v1.4.0
      version: 1.4.0
      tools_ref: 28038025aa91f24ff9a52e831df236b435c6ef87
      vst_dir: "."
      build: bash build.sh
      host_test: '"$MPC_VST/tools/test_port.sh" vst.json'
      about: JJ DA PLUG Messenger - Chat, Dateien, Bilder, MP3 und 16 Pads im WLAN, Beitritt per QR-Code oder Code, auch von MPC zu MPC.
      dry_run: true
