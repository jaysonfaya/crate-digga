# Baut Crate Digga 1.8 (JJ DA PLUG) für die MPC und legt die fertige ZIP-Datei als Download bereit.
# Start: Reiter "Actions" -> "Build Crate Digga" -> "Run workflow". Danach die ZIP unter "Artifacts" herunterladen.
name: Build Crate Digga
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@main
    permissions:
      contents: write
    with:
      tag: crate-digga-v1.8.0
      version: 1.8.0
      tools_ref: main
      vst_dir: "."
      build: bash build.sh
      host_test: '"$MPC_VST/tools/test_port.sh" vst.json'
      about: CRATE DIGGA von JJ DA PLUG - sucht freie Sounds (nur CC0 und Public Domain) im Internet Archive, bei Wikimedia und Openverse, spielt sie an, speichert sie im Crate und legt sie auf 64 Pads.
      dry_run: true
 
